# Nom du workflow qui s'affichera dans l'onglet "Actions" de votre depot GitHub.
name: Build and Push Docker Image ARM64 & AMD64

# Declencheurs du workflow.
on:
  # Se declenche automatiquement a chaque push sur la branche "main" (build de suivi -> tag "beta").
  push:
    branches:
      - "main"
  # Se declenche quand une Release GitHub est publiee : c'est le seul cas qui produit le tag "latest".
  release:
    types: [published]
  # Permet de declencher manuellement le workflow depuis l'interface de GitHub (build de test -> tag "beta").
  workflow_dispatch:

# Liste des jobs a executer.
jobs:
  # Nom du job.
  build-and-push:
    # Skip si le message contient [skip ci], [ci skip], etc.
    # Ce check ne s'applique qu'aux evenements "push" (release/workflow_dispatch n'ont pas de head_commit).
    if: |
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]'))
    # Machine virtuelle sur laquelle le job va s'executer.
    runs-on: ubuntu-latest
    # Permissions necessaires pour ce job.
    permissions:
      contents: read   # Lecture seule : plus aucun commit automatique dans le repo.
      packages: write  # Permission d'ecrire des packages (pour publier l'image sur ghcr.io).

    # Etapes du job.
    steps:
      # 1. Recupere le code source de votre depot.
      # persist-credentials: false evite que le token GitHub reste dans .git/config,
      # ce qui empeche toute fuite accidentelle si .git est inclus dans le contexte Docker.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Se connecte au GitHub Container Registry (ghcr.io).
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Le nom d'utilisateur est le proprietaire du depot, force en minuscules.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Configure QEMU pour l'emulation ARM64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # 4. Met en place Docker Buildx avec plateformes optimisees
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Prepare les metadonnees de l'image.
      # Release publiee -> tag "latest" + le tag Git de la release (ex: v2.5.0).
      # Push sur main ou workflow_dispatch manuel -> tag "beta" + "beta-<sha court>", jamais "latest".
      - name: Prepare image metadata
        run: |
          IMAGE_NAME=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"

          # Horodatage UTC toujours valide, quel que soit l'evenement declencheur
          # (github.event.head_commit.timestamp est vide pour release/workflow_dispatch).
          echo "IMAGE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_VERSION="${{ github.event.release.tag_name }}"
            RELEASE_VERSION_SHORT="${RELEASE_VERSION#v}"

            echo "BUILD_TAG=latest" >> "$GITHUB_ENV"
            echo "IMAGE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
            echo "IMAGE_VERSION_SHORT=${RELEASE_VERSION_SHORT}" >> "$GITHUB_ENV"

            echo "Build de release : ${RELEASE_VERSION} -> tag latest"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)

            echo "BUILD_TAG=beta" >> "$GITHUB_ENV"
            echo "IMAGE_VERSION=beta-${SHORT_SHA}" >> "$GITHUB_ENV"
            echo "IMAGE_VERSION_SHORT=beta-${SHORT_SHA}" >> "$GITHUB_ENV"

            echo "Build beta : commit ${SHORT_SHA} (tag: beta, pas de latest)"
          fi

      # 6. Genere le Dockerfile a partir du template et du fichier de configuration.
      - name: Generate Dockerfile
        run: python3 generate_dockerfile.py

      # 7. Construit l'image Docker et la publie sur le GitHub Container Registry.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          # Labels OCI dynamiques (version, date, git SHA)
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_VERSION_SHORT }}
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          # Cache desactive pour toujours recuperer les derniers correctifs de securite
          # apt-get upgrade -y dans le Dockerfile necessite un build sans cache
          no-cache: true
          # Provenance et SBOM actives : GHCR les supporte, ameliore la tracabilite
          # de la chaine d'approvisionnement (SLSA provenance + inventaire des composants).
          provenance: mode=max
          sbom: true
  # ============================================================
  # JOB DE NETTOYAGE : DESACTIVE
  # ============================================================
  # Le cleanup automatique corrompt les manifests multi-architecture car il supprime
  # les layers intermediaires avant leur complete propagation sur GHCR.
